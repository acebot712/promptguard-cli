# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
#
# Checked in CI (EmbarkStudios/cargo-deny-action) and locally via
# `cargo deny check`.

[graph]
all-features = true

[advisories]
# Deny crates with known security vulnerabilities (RUSTSEC advisories),
# and surface unmaintained/unsound notices as warnings.
version = 2
yanked = "deny"

[licenses]
version = 2
# Allowlist matching the licenses actually present in the dependency tree.
# All are permissive; MPL-2.0 (colored) is file-level copyleft, acceptable
# for a statically linked binary that does not modify the crate.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Warn on duplicate crate versions (bloats the binary) but do not fail:
# transitive deps routinely lag behind.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

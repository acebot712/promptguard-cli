name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
      - '.editorconfig'
  # Re-run the security job on a schedule so CVEs published after the
  # last commit (e.g. RUSTSEC-2026-0098 hit us a few days after our
  # last green build) are caught proactively rather than at next push.
  schedule:
    - cron: "0 6 * * *"

# Cancel in-flight runs for the same ref when a new commit lands.
# A new commit obsoletes the old test results, no point in burning
# minutes finishing them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only token. Each job that needs more escalates explicitly.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 release tag
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Swatinem/rust-cache is the SOTA Rust cache action: it keys on
      # rustc version + Cargo.lock, prunes target/ to keep the cache
      # small, and is ~2x faster than hand-rolled actions/cache for
      # the three cargo dirs.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: quality

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Cost control: macOS runners bill at 10x the Linux rate, so the macos leg of
  # this matrix was the dominant Actions spend. Run it only on main pushes and
  # the nightly cron (full platform coverage where it counts); on pull_request
  # — by far the most frequent trigger — test Linux-only (stable + beta, which
  # already cover the compiler axis). set-matrix emits the include list per
  # event. macos-stable still runs on every merge, so platform regressions are
  # caught before release at a fraction of the per-PR cost.
  set-matrix:
    name: Select test matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'matrix={"include":[{"os":"ubuntu-latest","rust":"stable"},{"os":"ubuntu-latest","rust":"beta"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"os":"ubuntu-latest","rust":"stable"},{"os":"ubuntu-latest","rust":"beta"},{"os":"macos-latest","rust":"stable"}]}' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test Suite
    needs: set-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Pinned to the immutable SHA of the v1 release tag; the toolchain
      # is selected via the `toolchain` input (the @stable/@beta refs are
      # moving branches, not immutable tags).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 release tag
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: test-${{ matrix.os }}-${{ matrix.rust }}

      - name: Run tests
        run: cargo test --all-features --verbose

      - name: Run integration tests
        run: |
          cargo test --test runtime_shim_tests
          cargo test --test environment_scanner_tests

      - name: Run API contract tests
        run: cargo test --test contract_tests

      - name: Build
        run: cargo build --release

      - name: Verify runtime shim functionality
        run: |
          ./target/release/promptguard --version
          ./target/release/promptguard --help

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # rustsec/audit-check posts findings as PR review comments / commit
    # statuses, so it needs write on those endpoints. checks: write is
    # for the commit status; pull-requests/issues: write covers the
    # rare case of opening a tracking issue for a new advisory.
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # cargo-deny: advisories, license allowlist, bans, and source checks
      # as configured in deny.toml.
      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check

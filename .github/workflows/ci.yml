name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
      - '.editorconfig'
  # Re-run the security job on a schedule so CVEs published after the
  # last commit (e.g. RUSTSEC-2026-0098 hit us a few days after our
  # last green build) are caught proactively rather than at next push.
  schedule:
    - cron: "0 6 * * *"

# Cancel in-flight runs for the same ref when a new commit lands.
# A new commit obsoletes the old test results, no point in burning
# minutes finishing them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only token. Each job that needs more escalates explicitly.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 release tag
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Swatinem/rust-cache is the SOTA Rust cache action: it keys on
      # rustc version + Cargo.lock, prunes target/ to keep the cache
      # small, and is ~2x faster than hand-rolled actions/cache for
      # the three cargo dirs.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: quality

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # The macOS leg runs on pull requests too, and there used to be a whole job
  # (`set-matrix`) whose only purpose was to withhold it. Its rationale --
  # "macOS runners bill at 10x the Linux rate, so the macos leg was the dominant
  # Actions spend" -- is true of a PRIVATE repository and void here: THIS REPO
  # IS PUBLIC, and GitHub bills nothing for standard runners on public repos.
  #
  # So that job was costing twice over. It withheld macOS coverage from the
  # trigger where a regression is cheapest to fix, and because `test` had
  # `needs: set-matrix`, every run waited for an extra job to be scheduled,
  # booted and torn down before any test could start. Inlining the matrix
  # removes that hop AND restores the coverage; the three legs run in parallel,
  # so wall clock is the slowest leg either way.
  #
  # If this repository ever goes private, the old trade becomes real again --
  # and it should then be re-derived from measurements, not restored from
  # memory.
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: ubuntu-latest
            rust: beta
          - os: macos-latest
            rust: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned to the immutable SHA of the v1 release tag; the toolchain
      # is selected via the `toolchain` input (the @stable/@beta refs are
      # moving branches, not immutable tags).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 release tag
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: test-${{ matrix.os }}-${{ matrix.rust }}

      # `--locked` so a PR that edits Cargo.toml without regenerating Cargo.lock
      # fails here rather than going green while CI silently resolves a
      # dependency set that differs from the one committed and shipped.
      #
      # This single invocation covers the integration tests too. There used to
      # be separate "Run integration tests" and "Run API contract tests" steps
      # naming `runtime_shim_tests`, `environment_scanner_tests` and
      # `contract_tests`, but all three are files in `tests/`, so they are
      # integration-test targets that `cargo test` already builds and runs.
      # The steps re-ran them, and read as though they needed a special
      # invocation. (They also could not have been covering a different feature
      # set: Cargo.toml declares no `[features]` at all, so `--all-features`
      # selects nothing extra. It stays for the day that changes.)
      - name: Run tests
        run: cargo test --all-features --locked --verbose

      # One leg only. This exists to prove the release profile links and the
      # binary starts -- a platform-independent smoke test -- and building it
      # three times compiles the whole tree three more times for one answer.
      - name: Build release binary and verify it runs
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: |
          cargo build --release --locked
          ./target/release/promptguard --version
          ./target/release/promptguard --help

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # rustsec/audit-check posts findings as PR review comments / commit
    # statuses, so it needs write on those endpoints. checks: write is
    # for the commit status; pull-requests/issues: write covers the
    # rare case of opening a tracking issue for a new advisory.
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # cargo-deny: advisories, license allowlist, bans, and source checks
      # as configured in deny.toml.
      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

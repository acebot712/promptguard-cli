name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'  # Trigger on tags like cli-v2.0.0

# Release workflow: read by default, build job does not need write,
# only the final `release` job that publishes assets needs contents:write.
permissions:
  contents: read

jobs:
  # The tag names the release; Cargo.toml names what the binary reports for
  # `promptguard --version`. Nothing made them agree, so a tag pushed without
  # bumping Cargo.toml shipped assets called cli-vX that identify themselves as
  # the previous version -- and the only way to notice was to run the binary.
  # The same defect shipped in the MCP image on 2026-08-23 from the other
  # direction, where the tag chose the CLI version.
  version-matches-tag:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/cli-v}"
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag cli-v$tag does not match Cargo.toml version $crate. \
          The published binary would report $crate while the release claims $tag."
            exit 1
          fi

  # Refuse to build a release nobody can read the notes for. A separate job
  # that `build` needs, rather than a step inside it, so a missing entry
  # costs seconds instead of paying for the full 4-platform matrix (one leg
  # of which is a paid macOS runner).
  notes-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require a CHANGELOG section for this tag
        run: |
          case "$GITHUB_REF_NAME" in
            cli-v[0-9]*) ;;
            *)
              echo "::notice::$GITHUB_REF_NAME is not a version tag -- skipping."
              exit 0
              ;;
          esac
          ver="${GITHUB_REF_NAME#cli-v}"
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" { grab=1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          # Present-but-empty is the failure mode to catch, not just a missing
          # heading -- test for content.
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no non-empty '## [$ver]' section."
            echo "::error::Write the release notes for $ver, then re-tag."
            exit 1
          fi
          echo "Release notes for $ver:"
          cat notes.md

  build:
    name: Build ${{ matrix.target }}
    needs: [version-matches-tag, notes-gate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64 (M1/M2/M3)
          - os: macos-latest
            target: aarch64-apple-darwin
            name: promptguard-macos-arm64

          # macOS x86_64 (Intel)
          - os: macos-latest
            target: x86_64-apple-darwin
            name: promptguard-macos-x86_64

          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: promptguard-linux-x86_64

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: promptguard-windows-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 release tag
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release

          # Handle Windows .exe extension
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BINARY_NAME="promptguard.exe"
            OUTPUT_NAME="${{ matrix.name }}.exe"
          else
            BINARY_NAME="promptguard"
            OUTPUT_NAME="${{ matrix.name }}"
          fi

          cp $BINARY_NAME $OUTPUT_NAME

          # Make executable (no-op on Windows, required on Unix)
          chmod +x $OUTPUT_NAME || true

          # Generate checksum
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            shasum -a 256 $OUTPUT_NAME > ${OUTPUT_NAME}.sha256
          else
            sha256sum $OUTPUT_NAME > ${OUTPUT_NAME}.sha256
          fi

          # Move to workspace root
          mv $OUTPUT_NAME $GITHUB_WORKSPACE/
          mv ${OUTPUT_NAME}.sha256 $GITHUB_WORKSPACE/

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only the publish job needs write to push the GitHub Release.
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lah release/

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/cli-v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: PromptGuard CLI v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## PromptGuard CLI v${{ steps.get_version.outputs.VERSION }}

            Drop-in LLM security for your applications - Built with Rust + Tree-sitter

            ### Installation

            **One-line install (macOS/Linux)**:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/acebot712/promptguard-cli/main/install.sh | sh
            ```

            **Manual install**:
            1. Download the binary for your platform below
            2. Make it executable: `chmod +x promptguard-*`
            3. Move to PATH: `sudo mv promptguard-* /usr/local/bin/promptguard`
            4. Verify: `promptguard --version`

            ### Checksums

            SHA256 checksums are provided for each binary (`.sha256` files).

            ### What's New

            - ✅ Real AST transformations using Tree-sitter
            - ✅ TypeScript, JavaScript, Python support
            - ✅ OpenAI, Anthropic, Cohere, HuggingFace providers
            - ✅ Automatic backups with safe revert
            - ✅ Single 5.3MB static binary

            ### Supported Platforms

            - macOS ARM64 (M1/M2/M3)
            - macOS x86_64 (Intel)
            - Linux x86_64
            - Windows x86_64

            ---

            📖 **Documentation**: https://docs.promptguard.co/cli
            🏠 **Homepage**: https://promptguard.co
            🐛 **Issues**: https://github.com/acebot712/promptguard-cli/issues
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

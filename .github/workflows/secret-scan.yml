name: Secret scan

# Deliberately NOT part of ci.yml, and deliberately without `paths-ignore`.
#
# ci.yml skips markdown-only and docs-only commits, which is right for build and
# test jobs and wrong for this one: a credential pasted into a README or a
# runbook is still a credential, and that is exactly the commit those filters
# wave through. Kept separate so it cannot inherit a path filter by accident,
# and so a red scan is unambiguous rather than one failure among many.
#
# This repository is public. A credential that reaches the default branch is
# world-readable immediately and has to be ROTATED, not reverted -- so the gate
# that matters is the one nobody can skip. The .githooks / pre-commit hook is
# the fast local courtesy; `git push --no-verify` walks straight past it.
#
# gitleaks-action scans the pushed range on a push and the PR range on a pull
# request; it never scans history, which is why it does not drown in the
# credential-shaped strings this codebase carries on purpose. Those live in
# .gitleaks.toml where the repo has one.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          # gitleaks-action diffs a range, so it needs the history that range
          # refers to; the default shallow clone makes it scan nothing.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
